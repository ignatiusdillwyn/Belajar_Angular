<div class="card p-2 m-3">
    <div class="card-body">
        <h1>Detail Film #{{movieId}}</h1>
        <h3>{{movieSchedule?.movieTitle}}</h3>
        <p>{{movieSchedule?.movieDescription}}</p>
        <p>Start jam {{ movieSchedule?.startTime | date:'dd MMM yyyy, HH:mm' }}</p>
    </div>
</div>
