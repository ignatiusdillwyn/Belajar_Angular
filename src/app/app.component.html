<p *ngIf="films.length === 0">Belum ada film</p>
<div>
  <ul>
    @for (film of films; track $index;) {
    <li>
      <div class="card mb-3 shadow-sm"
        [ngClass]="film.status == 1 ? 'bg-primary text-white' : 'bg-secondary text-white'">

        <div class="card-body d-flex justify-content-between align-items-center">

          <div>
            <h5 class="card-title mb-1">{{ film.filmName }}</h5>

            <div class="mb-2">
              <span class="badge" [ngClass]="film.status == 1 ? 'bg-success' : 'bg-warning text-dark'">
                {{ film.status == 1 ? 'Tayang' : 'Segera' }}
              </span>
            </div>

            <div class="d-flex gap-3 text-light" style="font-size: 0.9rem;">
              <span>{{ film.price | currency:'IDR' }}</span>
            </div>

            <div class="d-flex gap-30 text-light" style="font-size: 0.9rem;">
              <span>{{ film.totalView | number }} Views</span>
            </div>
          </div>

          <div>
            <button class="btn btn-danger btn-sm" (click)="deletePerItem($index)">
              Hapus
            </button>
          </div>

        </div>
      </div>
    </li>
    }
  </ul>

</div>
